version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pyramidplay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-pyramidplay}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pyramidplay-network

  minio:
    image: minio/minio
    container_name: pyramidplay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pyramidplay-network

  mailhog:
    image: mailhog/mailhog
    container_name: pyramidplay-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pyramidplay-network

networks:
  pyramidplay-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
